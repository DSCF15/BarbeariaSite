<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Straight Razor Left -->
  <g id="razor-left">
    <!-- Handle -->
    <ellipse cx="60" cy="100" rx="12" ry="30" fill="#1a1a1a" stroke="#ffd700" stroke-width="2"/>
    <!-- Blade curve -->
    <path d="M 72 80 Q 110 70 120 100 Q 110 130 72 120" fill="none" stroke="#2a2a2a" stroke-width="8"/>
    <path d="M 72 80 Q 110 70 120 100 Q 110 130 72 120" fill="none" stroke="#555" stroke-width="6"/>
    <!-- Shine -->
    <path d="M 75 85 Q 105 78 115 100" fill="none" stroke="#aaa" stroke-width="2"/>
  </g>

  <!-- Straight Razor Right (mirrored) -->
  <g id="razor-right" transform="translate(300, 0) scale(-1, 1)">
    <ellipse cx="60" cy="100" rx="12" ry="30" fill="#1a1a1a" stroke="#ffd700" stroke-width="2"/>
    <path d="M 72 80 Q 110 70 120 100 Q 110 130 72 120" fill="none" stroke="#2a2a2a" stroke-width="8"/>
    <path d="M 72 80 Q 110 70 120 100 Q 110 130 72 120" fill="none" stroke="#555" stroke-width="6"/>
    <path d="M 75 85 Q 105 78 115 100" fill="none" stroke="#aaa" stroke-width="2"/>
  </g>

  <!-- Wings Left -->
  <g id="wings-left">
    <path d="M 95 50 Q 85 45 80 55 Q 75 65 85 70 Q 95 75 105 65 Z" fill="#ffd700" stroke="#1a1a1a" stroke-width="1.5"/>
    <path d="M 90 52 Q 87 50 85 53 Q 83 60 88 65 Q 92 68 98 62" fill="none" stroke="#1a1a1a" stroke-width="0.8"/>
  </g>

  <!-- Wings Right -->
  <g id="wings-right">
    <path d="M 205 50 Q 215 45 220 55 Q 225 65 215 70 Q 205 75 195 65 Z" fill="#ffd700" stroke="#1a1a1a" stroke-width="1.5"/>
    <path d="M 210 52 Q 213 50 215 53 Q 217 60 212 65 Q 208 68 202 62" fill="none" stroke="#1a1a1a" stroke-width="0.8"/>
  </g>

  <!-- Banner ribbon -->
  <g id="banner">
    <!-- Ribbon body -->
    <path d="M 70 105 Q 80 115 150 120 Q 220 115 230 105 L 230 145 Q 150 150 70 145 Z" fill="#ffd700" stroke="#1a1a1a" stroke-width="2"/>
    
    <!-- Banner folds/edges -->
    <path d="M 70 145 L 60 155 L 70 150" fill="#e6c200"/>
    <path d="M 230 145 L 240 155 L 230 150" fill="#e6c200"/>
    
    <!-- Stars -->
    <circle cx="90" cy="125" r="3" fill="#1a1a1a"/>
    <circle cx="210" cy="125" r="3" fill="#1a1a1a"/>
    
    <!-- Text -->
    <text x="150" y="135" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1a1a1a" text-anchor="middle">BARBEARIA</text>
    <text x="150" y="152" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#ff4444" text-anchor="middle">J</text>
  </g>
</svg>
